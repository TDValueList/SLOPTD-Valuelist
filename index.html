<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>SLOPTD Valuelist</title>
<style>
:root{
  --bg:#fff2fa;
  --ink:#612f4d;
  --muted:#a47791;
  --pink:#ff5da8;
  --pink2:#ff9acc;
  --purple:#9e6bff;
  --green:#42bf98;
  --red:#e65f7e;
  --card:#fffafd;
  --line:rgba(206,83,147,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 8%,rgba(255,191,224,.8),transparent 32%),
    radial-gradient(circle at 90% 15%,rgba(210,188,255,.5),transparent 30%),
    radial-gradient(circle at 80% 90%,rgba(137,238,208,.22),transparent 32%),
    linear-gradient(180deg,#fff9fd 0%,#ffedf7 60%,#f9efff 100%);
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.55;cursor:not-allowed}
.page{width:min(1500px,100%);margin:0 auto;padding:18px 14px 42px}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px
}
.brand{
  font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.05em;color:#79375b;
  text-shadow:0 12px 30px rgba(198,64,132,.15)
}
.brand::after{content:" ✦";color:var(--pink)}
.sub{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid rgba(198,75,137,.16);background:rgba(255,255,255,.82);color:#743954;
  padding:9px 13px;border-radius:999px;box-shadow:0 8px 22px rgba(170,74,130,.08)
}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#fff}
.btn.primary{background:linear-gradient(135deg,#ff69b1,#ff4c9e);color:#fff;border-color:#ff70b6}
.btn.danger{color:#c44369;background:#fff7f9}
.authbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.status-pill{
  font-size:12px;color:#95627c;background:rgba(255,255,255,.62);border:1px solid var(--line);
  border-radius:999px;padding:7px 10px
}
.status-pill.admin{color:#229170}
.notice{
  margin:7px 0;padding:10px 12px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.58);font-size:12px;color:#96677f
}
.notice.ok{border-color:rgba(66,191,152,.25);color:#248b6f}
.notice.bad{border-color:rgba(230,95,126,.25);color:#bd455e}
.hidden{display:none!important}
.filters{
  display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(120px,.7fr));
  gap:9px;margin:10px 0 6px
}
.field{
  min-width:0;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.82);
  color:#67364f;border-radius:16px;padding:11px 12px;outline:none;box-shadow:0 10px 24px rgba(176,74,131,.055)
}
.field:focus{border-color:rgba(255,93,168,.35);box-shadow:0 0 0 4px rgba(255,93,168,.08)}
.viewer-wrap{
  position:relative;
  width:100%;
  min-height:710px;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1200px;
  overflow:hidden;
  touch-action:pan-y;
}
.viewer{
  position:relative;width:min(920px,100%);height:650px;display:flex;align-items:center;justify-content:center;
  user-select:none
}
.card{
  position:absolute;
  width:min(440px,72vw);
  min-height:600px;
  border-radius:34px;
  border:1px solid rgba(204,83,146,.18);
  background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(255,242,249,.94));
  box-shadow:0 28px 75px rgba(167,70,126,.18),inset 0 1px 0 #fff;
  padding:18px;
  transform-style:preserve-3d;
  transition:transform .34s cubic-bezier(.2,.75,.2,1),opacity .28s ease,filter .28s ease,z-index .28s ease;
  display:flex;flex-direction:column;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:34px;pointer-events:none;
  background:
    radial-gradient(circle at 7% 12%,rgba(255,255,255,.95) 0 4px,transparent 5px),
    radial-gradient(circle at 93% 13%,rgba(255,215,111,.65) 0 4px,transparent 5px),
    radial-gradient(circle at 14% 89%,rgba(116,225,194,.44) 0 4px,transparent 5px)
}
.card.current{z-index:10;box-shadow:0 30px 85px rgba(167,70,126,.22),inset 0 1px 0 #fff}
.card.side{filter:saturate(.9)}
.card-far{pointer-events:none}
.card.clickable-side{cursor:pointer}
.card-head{position:relative;z-index:2;text-align:center}
.item-name{
  margin:0;font-size:clamp(22px,3vw,29px);font-weight:900;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#713653
}
.rarity{margin-top:6px;font-size:15px;font-weight:800;color:#956781}
.rarity.exclusive{color:#d94399}.rarity.rare{color:#6e86ce}.rarity.godly{color:#826aa0}
.image-box{
  position:relative;z-index:2;width:min(300px,70%);aspect-ratio:1/1;margin:18px auto;
  border-radius:25px;overflow:hidden;background:linear-gradient(150deg,#fff,#ffe8f4 58%,#f1e6ff);
  border:1px solid rgba(205,80,143,.15);box-shadow:inset 0 0 0 8px rgba(255,255,255,.45),0 18px 40px rgba(175,74,132,.11)
}
.image-box img{display:block;width:100%;height:100%;object-fit:contain}
.placeholder{height:100%;display:grid;place-items:center;color:#c38aa7;font-size:13px;font-weight:800;line-height:1.5;text-align:center}
.data{position:relative;z-index:2;margin-top:auto}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 3px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row-label{color:#9b6b85}.row-value{font-weight:900;color:#622f4c;text-align:right}
.unstable{color:#e48b00!important}.fluctuating{color:#8b6178!important}.stable{color:#6e6883!important}
.card-buttons{
  position:relative;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;
}
.card-buttons .btn{
  min-height:46px;border-radius:15px;position:relative;z-index:50;pointer-events:auto
}
.card.current .card-buttons{pointer-events:auto}
.nav{
  display:flex;justify-content:center;align-items:center;gap:18px;margin-top:-25px;position:relative;z-index:50
}
.nav-btn{
  width:54px;height:54px;border-radius:50%;border:1px solid rgba(199,74,139,.15);background:#fff;color:#bd4b87;
  font-size:25px;box-shadow:0 12px 26px rgba(169,72,128,.12);pointer-events:auto
}
.counter{min-width:70px;text-align:center;color:#9b6983;font-weight:800}
.manage{
  width:min(820px,100%);margin:0 auto 14px;padding:11px 13px;border:1px solid rgba(207,82,147,.14);
  border-radius:17px;background:rgba(255,255,255,.62);box-shadow:0 10px 25px rgba(174,72,129,.06)
}
.manage-line{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.manage-label{font-size:12px;color:#96657e;font-weight:800;margin-right:3px}
.manage .btn{border-radius:13px;min-height:40px}
.empty{padding:80px 12px;text-align:center;color:#9b6b84}
.modal-backdrop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:15px;z-index:1000;
  background:rgba(81,40,64,.28);backdrop-filter:blur(8px)
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(580px,100%);max-height:90vh;overflow:auto;border:1px solid rgba(205,80,143,.18);
  border-radius:27px;background:linear-gradient(160deg,#fffafd,#fff0f7);padding:19px;box-shadow:0 36px 100px rgba(80,38,62,.27)
}
.modal h2{margin:0 0 5px;color:#713653}.modal p{margin:0 0 16px;color:#9c6982;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.input-wrap{display:flex;flex-direction:column;gap:6px}.input-wrap.full{grid-column:1/-1}
.input-wrap label{font-size:12px;color:#86566f}.input-wrap input,.input-wrap select{
  width:100%;border:1px solid var(--line);background:#fff;color:#5e3049;border-radius:13px;padding:10px;outline:none
}
.preview{margin-top:12px;min-height:150px;border:1px solid var(--line);background:#fff7fb;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.preview img{max-width:100%;max-height:230px;object-fit:contain}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr 1fr}.viewer-wrap{min-height:680px}.viewer{height:620px}}
@media(max-width:700px){
  .page{padding:13px 9px 30px}.filters{grid-template-columns:1fr 1fr}.viewer-wrap{min-height:620px}.viewer{height:570px}
  .card{width:min(365px,78vw);min-height:525px;padding:14px;border-radius:28px}.image-box{width:min(230px,62%);margin:13px auto}
  .item-name{font-size:22px}.row{font-size:13px}.card-buttons .btn{min-height:42px}
}
@media(max-width:420px){
  .filters{grid-template-columns:1fr}.viewer-wrap{min-height:590px}.viewer{height:545px}
  .card{width:84vw;min-height:510px}.image-box{width:58%}.nav{margin-top:-20px}
  .grid{grid-template-columns:1fr}.input-wrap.full{grid-column:auto}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <div class="brand">SLOPTD Valuelist</div>
      <div class="sub">A playful collectible value list</div>
    </div>
    <div class="actions">
      <button class="btn" id="sortValue">Value ↓</button>
      <button class="btn" id="sortDemand">Demand ↓</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn primary hidden" id="addTop">＋ Add Item</button>
      <button class="btn hidden" id="refreshTop">↻ Refresh</button>
    </div>
  </header>

  <div class="authbar">
    <span class="status-pill" id="authStatus">Connecting…</span>
    <button class="btn" id="loginBtn">Admin Login</button>
    <button class="btn hidden" id="logoutBtn">Logout</button>
  </div>

  <div id="notice" class="notice hidden"></div>

  <div class="filters">
    <input class="field" id="search" type="search" placeholder="Search item name...">
    <select class="field" id="rarityFilter"><option value="">All Rarities</option></select>
    <select class="field" id="statusFilter"><option value="">All Status</option><option>Fluctuating</option><option>Unstable</option><option>Stable</option></select>
    <select class="field" id="sortSelect"><option value="default">Sort: Default</option><option value="value">Sort: Value</option><option value="demand">Sort: Demand</option><option value="name">Sort: Name</option></select>
    <button class="btn" id="clearFilters">Clear Filters</button>
  </div>

  <div class="manage hidden" id="manageBar">
    <div class="manage-line">
      <span class="manage-label">ADMIN • current item</span>
      <button class="btn" id="manageEdit">✏ Edit</button>
      <button class="btn danger" id="manageDelete">🗑 Delete</button>
      <button class="btn primary" id="manageAdd">＋ Add Item</button>
    </div>
  </div>

  <section class="viewer-wrap" id="viewerWrap">
    <div class="viewer" id="viewer"></div>
  </section>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button>
    <div class="counter" id="counter">0 / 0</div>
    <button class="nav-btn" id="nextBtn" aria-label="Next">›</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true">
    <div id="loginPanel">
      <h2>Admin Login</h2>
      <p>Only your authorized Supabase account can edit the shared list.</p>
      <form id="loginForm">
        <div class="grid">
          <div class="input-wrap full"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
          <div class="input-wrap full"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
        </div>
        <div class="modal-actions"><button type="button" class="btn" id="cancelLogin">Cancel</button><button class="btn primary" type="submit">Login</button></div>
      </form>
    </div>

    <div id="itemPanel" class="hidden">
      <h2 id="itemModalTitle">Add Item</h2>
      <p>Changes are saved to Supabase and become visible to everyone.</p>
      <form id="itemForm">
        <div class="grid">
          <div class="input-wrap full"><label>Item Name</label><input id="nameInput" maxlength="80" required></div>
          <div class="input-wrap"><label>Rarity</label><input id="rarityInput" maxlength="40" required></div>
          <div class="input-wrap"><label>Value</label><input id="valueInput" maxlength="40" required></div>
          <div class="input-wrap"><label>Demand (0–10)</label><input id="demandInput" type="number" min="0" max="10" step="0.1" required></div>
          <div class="input-wrap"><label>Status</label><select id="statusInput"><option>Fluctuating</option><option>Unstable</option><option>Stable</option></select></div>
          <div class="input-wrap full"><label>Image file</label><input id="imageInput" type="file" accept="image/*"></div>
        </div>
        <div class="preview" id="imagePreview"><span style="color:#c28aa6;font-size:12px">No image selected</span></div>
        <div class="modal-actions"><button class="btn" type="button" id="cancelItem">Cancel</button><button class="btn primary" type="submit">Save Item</button></div>
      </form>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SUPABASE CONNECTION
   ============================================================ */
const SUPABASE_URL = "https://ngdnoxnsxnxurwrcdnaq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hlirW-rb_auYcp5XALLcbQ_jtYXUCKV";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession:true, autoRefreshToken:true }
});

let items = [];
let currentIndex = 0;
let currentUser = null;
let isAdmin = false;
let editingId = null;
let selectedImageFile = null;
let oldImagePath = "";
let dragStartX = null;
let dragging = false;

const $ = id => document.getElementById(id);
const viewer = $("viewer");
const viewerWrap = $("viewerWrap");

function esc(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function rarityClass(v){ return String(v).toLowerCase().replace(/[^a-z0-9]+/g,"-"); }
function parseValue(v){
  const m=String(v).replaceAll(",","").match(/[0-9]+(?:\.[0-9]+)?/);
  return m?Number(m[0]):0;
}
function demandText(v){ return `${Number(v).toFixed(Number(v)%1===0?0:1)}/10`; }
function imageUrl(path){
  return path ? `${SUPABASE_URL}/storage/v1/object/public/value-images/${encodeURIComponent(path).replaceAll("%2F","/")}` : "";
}
function showNotice(text,type=""){
  $("notice").textContent=text;
  $("notice").className="notice"+(type?" "+type:"");
  $("notice").classList.remove("hidden");
}
function hideNotice(){ $("notice").classList.add("hidden"); }

async function checkAdmin(){
  if(!currentUser) return false;
  const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle();
  if(error) {
    console.error("admin check failed", error);
    return false;
  }
  return !!data;
}

async function refreshAuth(){
  const {data}=await db.auth.getUser();
  currentUser=data?.user||null;
  isAdmin=await checkAdmin();

  if(currentUser && isAdmin){
    $("authStatus").textContent="Admin mode";
    $("authStatus").classList.add("admin");
    $("loginBtn").classList.add("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("addTop").classList.remove("hidden");
    $("refreshTop").classList.remove("hidden");
    $("manageBar").classList.remove("hidden");
  }else{
    $("authStatus").textContent="Public viewer";
    $("authStatus").classList.remove("admin");
    $("loginBtn").classList.remove("hidden");
    $("logoutBtn").classList.add("hidden");
    $("addTop").classList.add("hidden");
    $("refreshTop").classList.add("hidden");
    $("manageBar").classList.add("hidden");
  }
  render();
}

async function loadItems(keepIndex=true){
  const beforeId = items[currentIndex]?.id;
  const {data,error}=await db.from("value_items")
    .select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true});

  if(error){
    showNotice("Could not load the Value List: "+error.message,"bad");
    return;
  }

  items=data||[];
  updateRarityOptions();

  if(!items.length){
    currentIndex=0;
  }else if(keepIndex && beforeId!=null){
    const found=items.findIndex(x=>x.id===beforeId);
    currentIndex=found>=0?found:Math.min(currentIndex,items.length-1);
  }else{
    currentIndex=Math.min(currentIndex,items.length-1);
  }
  render();
}

function updateRarityOptions(){
  const sel=$("rarityFilter"), cur=sel.value;
  const vals=[...new Set(items.map(x=>x.rarity).filter(Boolean))].sort();
  sel.innerHTML='<option value="">All Rarities</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join("");
  sel.value=vals.includes(cur)?cur:"";
}

function filteredItems(){
  const q=$("search").value.trim().toLowerCase();
  const r=$("rarityFilter").value;
  const s=$("statusFilter").value;
  let arr=items.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!r||x.rarity===r)&&(!s||x.status===s));
  const sort=$("sortSelect").value;
  if(sort==="value") arr.sort((a,b)=>parseValue(b.value)-parseValue(a.value));
  if(sort==="demand") arr.sort((a,b)=>Number(b.demand)-Number(a.demand));
  if(sort==="name") arr.sort((a,b)=>a.name.localeCompare(b.name));
  return arr;
}

function cardTransform(offset){
  if(offset===0) return "translateX(0) translateZ(70px) rotateY(0deg) scale(1)";
  const dir=offset>0?1:-1;
  const abs=Math.abs(offset);
  if(abs===1) return `translateX(${dir*300}px) translateZ(-70px) rotateY(${dir*-22}deg) scale(.83)`;
  if(abs===2) return `translateX(${dir*520}px) translateZ(-240px) rotateY(${dir*-34}deg) scale(.68)`;
  return `translateX(${dir*700}px) translateZ(-380px) rotateY(${dir*-42}deg) scale(.55)`;
}

function render(){
  const data=filteredItems();
  viewer.innerHTML="";

  if(!data.length){
    viewer.innerHTML='<div class="empty">No matching items.</div>';
    $("counter").textContent="0 / 0";
    $("manageBar").classList.toggle("hidden", !isAdmin);
    return;
  }

  if(currentIndex>=data.length) currentIndex=data.length-1;
  const current=data[currentIndex];

  data.forEach((item,index)=>{
    let diff=index-currentIndex;
    if(diff>data.length/2) diff-=data.length;
    if(diff<-data.length/2) diff+=data.length;
    const abs=Math.abs(diff);

    const card=document.createElement("article");
    card.className="card "+(diff===0?"current":"side")+(abs>2?" card-far":" clickable-side");
    card.style.transform=cardTransform(Math.max(-3,Math.min(3,diff)));
    card.style.opacity=abs>3?"0":"1";
    card.style.zIndex=String(20-abs);
    if(abs>2) card.style.pointerEvents="none";

    const img=item.image_path?imageUrl(item.image_path):"";
    card.innerHTML=`
      <div class="card-head">
        <h2 class="item-name" title="${esc(item.name)}">${esc(item.name)}</h2>
        <div class="rarity ${rarityClass(item.rarity)}">${esc(item.rarity)}</div>
      </div>
      <div class="image-box">
        ${img?`<img src="${esc(img)}" alt="${esc(item.name)}">`:`<div class="placeholder">IMAGE<br>ADD LATER</div>`}
      </div>
      <div class="data">
        <div class="row"><span class="row-label">Value</span><span class="row-value">${esc(item.value)}</span></div>
        <div class="row"><span class="row-label">Demand</span><span class="row-value">${demandText(item.demand)}</span></div>
        <div class="row"><span class="row-label">Status</span><span class="row-value ${rarityClass(item.status)}">${esc(item.status)}</span></div>
      </div>
      ${isAdmin&&diff===0?`
        <div class="card-buttons">
          <button type="button" class="btn" data-action="edit" data-id="${item.id}">✏ Edit</button>
          <button type="button" class="btn danger" data-action="delete" data-id="${item.id}">🗑 Delete</button>
        </div>`:""}
    `;

    // Side cards are navigable but never steal input from the current card.
    if(abs===1){
      card.addEventListener("click",e=>{
        if(e.target.closest("button")) return;
        e.preventDefault();
        currentIndex=index;
        render();
      });
    }

    viewer.appendChild(card);
  });

  $("counter").textContent=`${currentIndex+1} / ${data.length}`;
  if(isAdmin){
    $("manageBar").classList.remove("hidden");
    $("manageEdit").textContent=`✏ Edit ${current.name}`;
  }else{
    $("manageBar").classList.add("hidden");
  }
}

async function openLogin(){
  $("loginPanel").classList.remove("hidden");
  $("itemPanel").classList.add("hidden");
  $("modalBackdrop").classList.add("open");
  $("loginEmail").focus();
}
function closeModal(){ $("modalBackdrop").classList.remove("open"); }
async function openItemModal(id=null){
  if(!isAdmin){showNotice("Admin permission is required.","bad");return;}
  editingId=id;selectedImageFile=null;oldImagePath="";
  $("itemForm").reset();
  $("imagePreview").innerHTML='<span style="color:#c28aa6;font-size:12px">No image selected</span>';
  $("itemModalTitle").textContent=id==null?"Add Item":"Edit Item";
  $("loginPanel").classList.add("hidden");
  $("itemPanel").classList.remove("hidden");

  if(id!=null){
    const x=items.find(a=>a.id===id);
    if(!x)return;
    $("nameInput").value=x.name;
    $("rarityInput").value=x.rarity;
    $("valueInput").value=x.value;
    $("demandInput").value=x.demand;
    $("statusInput").value=x.status;
    oldImagePath=x.image_path||"";
    if(oldImagePath) $("imagePreview").innerHTML=`<img src="${esc(imageUrl(oldImagePath))}" alt="">`;
  }
  $("modalBackdrop").classList.add("open");
  $("nameInput").focus();
}

async function uploadImage(file,itemId){
  const safeExt=(file.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")||"png";
  const path=`${itemId}/${crypto.randomUUID()}.${safeExt}`;
  const {error}=await db.storage.from("value-images").upload(path,file,{
    contentType:file.type,
    cacheControl:"31536000",
    upsert:false
  });
  if(error) throw error;
  return path;
}

async function saveItem(e){
  e.preventDefault();
  if(!isAdmin){showNotice("Admin permission is required.","bad");return;}
  const payload={
    name:$("nameInput").value.trim(),
    rarity:$("rarityInput").value.trim(),
    value:$("valueInput").value.trim(),
    demand:Number($("demandInput").value),
    status:$("statusInput").value
  };
  if(!payload.name||!payload.rarity||!payload.value||Number.isNaN(payload.demand))return;

  try{
    if(editingId==null){
      const {data,error}=await db.from("value_items").insert({
        ...payload,
        sort_order:items.length
      }).select("id").single();
      if(error)throw error;

      if(selectedImageFile){
        const p=await uploadImage(selectedImageFile,data.id);
        const {error:e2}=await db.from("value_items").update({image_path:p}).eq("id",data.id);
        if(e2)throw e2;
      }
    }else{
      if(selectedImageFile){
        payload.image_path=await uploadImage(selectedImageFile,editingId);
      }
      const {error}=await db.from("value_items").update(payload).eq("id",editingId);
      if(error)throw error;
    }

    closeModal();
    await loadItems();
    showNotice("Saved to the shared Value List.","ok");
  }catch(err){
    console.error(err);
    showNotice("Save failed: "+err.message,"bad");
  }
}

async function deleteCurrent(id){
  if(!isAdmin){showNotice("Admin permission is required.","bad");return;}
  const item=items.find(x=>x.id===id);
  if(!item)return;

  if(!confirm(`Delete "${item.name}"?\\n\\nThis removes it from the shared Value List.`))return;

  try{
    const {error}=await db.from("value_items").delete().eq("id",id);
    if(error)throw error;

    currentIndex=Math.max(0,currentIndex-1);
    await loadItems(false);
    showNotice("Item deleted.","ok");
  }catch(err){
    console.error(err);
    showNotice("Delete failed: "+err.message,"bad");
  }
}

/* ---------- Click handling: buttons live above the 3D layers ---------- */
viewer.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")) return;
  dragStartX=e.clientX; dragging=false;
});
viewer.addEventListener("pointermove",e=>{
  if(dragStartX==null)return;
  if(Math.abs(e.clientX-dragStartX)>8)dragging=true;
});
viewer.addEventListener("pointerup",e=>{
  if(dragStartX==null)return;
  const dx=e.clientX-dragStartX;
  dragStartX=null;
  if(dragging && Math.abs(dx)>45){
    if(dx<0)nextCard();else prevCard();
  }
});
viewer.addEventListener("pointercancel",()=>{dragStartX=null});

viewer.addEventListener("click",e=>{
  const btn=e.target.closest("button[data-action]");
  if(!btn)return;
  e.preventDefault();
  e.stopPropagation();
  const id=Number(btn.dataset.id);
  if(btn.dataset.action==="edit")openItemModal(id);
  if(btn.dataset.action==="delete")deleteCurrent(id);
});

function nextCard(){
  const data=filteredItems();
  if(data.length){currentIndex=(currentIndex+1)%data.length;render();}
}
function prevCard(){
  const data=filteredItems();
  if(data.length){currentIndex=(currentIndex-1+data.length)%data.length;render();}
}

$("prevBtn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();prevCard()});
$("nextBtn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();nextCard()});
$("manageEdit").addEventListener("click",()=>{const data=filteredItems();if(data[currentIndex])openItemModal(data[currentIndex].id)});
$("manageDelete").addEventListener("click",()=>{const data=filteredItems();if(data[currentIndex])deleteCurrent(data[currentIndex].id)});
$("manageAdd").addEventListener("click",()=>openItemModal());
$("addTop").addEventListener("click",()=>openItemModal());
$("refreshTop").addEventListener("click",async()=>{hideNotice();await loadItems();showNotice("Refreshed from Supabase.","ok")});

$("loginBtn").addEventListener("click",openLogin);
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();await refreshAuth();showNotice("Logged out.","ok")});
$("cancelLogin").addEventListener("click",closeModal);
$("cancelItem").addEventListener("click",closeModal);
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowRight")nextCard();
  if(e.key==="ArrowLeft")prevCard();
});

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();hideNotice();
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){showNotice("Login failed: "+error.message,"bad");return;}
  await refreshAuth();
  if(!isAdmin){
    await db.auth.signOut();
    await refreshAuth();
    showNotice("This account is not authorized as the site administrator.","bad");
    return;
  }
  closeModal();
  showNotice("Admin login successful.","ok");
});

$("itemForm").addEventListener("submit",saveItem);
$("imageInput").addEventListener("change",()=>{
  selectedImageFile=$("imageInput").files[0]||null;
  if(!selectedImageFile){
    $("imagePreview").innerHTML='<span style="color:#c28aa6;font-size:12px">No image selected</span>';
    return;
  }
  const r=new FileReader();
  r.onload=e=>$("imagePreview").innerHTML=`<img src="${e.target.result}" alt="">`;
  r.readAsDataURL(selectedImageFile);
});

["search","rarityFilter","statusFilter","sortSelect"].forEach(id=>{
  const el=$(id);
  el.addEventListener(id==="search"?"input":"change",()=>{
    currentIndex=0;
    render();
  });
});
$("clearFilters").addEventListener("click",()=>{
  $("search").value="";$("rarityFilter").value="";$("statusFilter").value="";$("sortSelect").value="default";
  currentIndex=0;render();
});
$("sortValue").addEventListener("click",()=>{$("sortSelect").value="value";currentIndex=0;render()});
$("sortDemand").addEventListener("click",()=>{$("sortSelect").value="demand";currentIndex=0;render()});
$("reset").addEventListener("click",()=>{
  $("search").value="";$("rarityFilter").value="";$("statusFilter").value="";$("sortSelect").value="default";currentIndex=0;render()
});

/* Mouse wheel changes the current card, but never when over a modal or form. */
viewerWrap.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaY)<25)return;
  e.preventDefault();
  if(e.deltaY>0)nextCard();else prevCard();
},{passive:false});

db.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));

(async()=>{
  await refreshAuth();
  await loadItems();
})();
</script>
</body>
</html>
